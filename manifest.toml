packaging_format = 2

id = "noalyss"
name = "Noalyss"
description.en = "Accounting free software (Belgian and French accounting)"
description.fr = "Logiciel libre de comptabilité (comptabilité Belge et Française)"

version = "10.2.0.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only"
website = "http://noalyss.eu"
demo = "http://demo.noalyss.eu/index.php"
admindoc = "https://wiki.noalyss.eu/doku.php"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "1000M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/noalyss"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    
    [resources]
        [resources.sources.main]
        url = "https://gitlab.com/noalyss/noalyss/-/archive/rel10200/noalyss-rel10200.tar.gz"
        sha256 = "29759a4490f7870ef1799752a29faffe5fbc2a3969e6f9d42a8d11a87f514f94"
        #autoupdate.strategy = "latest_gitlab_tag"
        #autoupdate.version_regex = "^rel(10200)$"
        
        [resources.system_user]

        [resources.install_dir]
        group = "www-data:r-x"

        [resources.permissions]
        main.url = "/"

        [resources.apt]
        packages = "postgresql, libgd-dev, php-php-gettext, php8.4-pgsql, php8.4-zip, php8.4-mbstring, php8.4-bcmath, php8.4-xml, php8.4-gmp, php8.4-gd"

        [resources.database]
        type = "postgresql"
