packaging_format = 2

id = "noalyss"
name = "Noalyss"
description.en = "Accounting free software (Belgian and French accounting)"
description.fr = "Logiciel libre de comptabilité (comptabilité Belge et Française)"

version = "10.1.0.0~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0-only"
website = "http://noalyss.eu"
demo = "http://demo.noalyss.eu/index.php"
admindoc = "https://wiki.noalyss.eu/doku.php"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = false
sso = false

disk = "50M"
ram.build = "1000M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/noalyss"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
[resources]
        [resources.sources.main]
        url = "https://download.noalyss.eu/derniere-version/noalyss-10100.tar.gz"
        sha256 = "f0b09eed36c90c1077f8b6420b48e5cc81cbb37a5a410d491422c782e9b382ee"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql, libgd-dev, php-php-gettext, php8.4-pgsql, php8.4-zip, php8.4-mbstring, php8.4-bcmath, php8.4-xml, php8.4-gmp, php8.4-gd"

    [resources.database]
    type = "postgresql"
